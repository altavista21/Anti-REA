[package]
name = "aegisforge"
version = "0.1.0"
edition = "2021"
description = "A file protection CLI prototype using authenticated encryption"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
